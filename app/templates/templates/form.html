{% extends "base.html" %}
{% block title %}{{ title }} — HabitFlow{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div style="max-width:600px">
    <form method="POST" id="templateForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">Название шаблона</label>
            <input type="text" name="name" class="form-control" required
                   placeholder="Например: Здоровый образ жизни"
                   value="{{ template.name if template else '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Описание</label>
            <textarea name="description" class="form-control" rows="2"
                      placeholder="Краткое описание набора привычек">{{ template.description if template else '' }}</textarea>
        </div>

        <div class="row g-3 mb-3">
            <div class="col-8">
                <label class="form-label">Иконка (Bootstrap Icons)</label>
                <input type="text" name="icon" class="form-control"
                       value="{{ template.icon if template else 'collection' }}"
                       placeholder="heart, trophy, book...">
            </div>
            <div class="col-4">
                <label class="form-label">Цвет</label>
                <input type="color" name="color" class="form-control form-control-color"
                       value="{{ template.color if template else '#f59e0b' }}">
            </div>
        </div>

        {% if current_user.is_moderator %}
        <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="is_public" id="is_public"
                   {{ 'checked' if template and template.is_public }}>
            <label class="form-check-label" for="is_public">Публичный шаблон (виден всем)</label>
        </div>
        {% endif %}

        <h6 style="color:var(--text-dark);margin-bottom:12px">Привычки</h6>
        <div id="habitsContainer">
            <div class="template-habit-row card mb-2">
                <div class="card-body py-2 px-3">
                    <div class="row g-2 align-items-center">
                        <div class="col-5">
                            <input type="text" name="habit_name" class="form-control form-control-sm"
                                   placeholder="Название привычки" required>
                        </div>
                        <div class="col-3">
                            <select name="habit_frequency" class="form-select form-select-sm">
                                <option value="daily">Ежедневно</option>
                                <option value="weekly">По дням</option>
                            </select>
                        </div>
                        <div class="col-2">
                            <input type="color" name="habit_color" class="form-control form-control-sm form-control-color"
                                   value="#0d6efd">
                        </div>
                        <div class="col-2 text-end">
                            <button type="button" class="btn btn-sm btn-outline-danger remove-habit" style="border:none">
                                <i class="bi bi-x-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <button type="button" id="addHabit" class="btn btn-outline-secondary btn-sm mb-4">
            <i class="bi bi-plus"></i> Добавить привычку
        </button>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="{{ url_for('templates.index') }}" class="btn btn-outline-secondary">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('addHabit').addEventListener('click', function() {
    const container = document.getElementById('habitsContainer');
    const row = container.querySelector('.template-habit-row').cloneNode(true);
    row.querySelector('input[name="habit_name"]').value = '';
    row.querySelector('input[name="habit_color"]').value = '#0d6efd';
    row.querySelector('select[name="habit_frequency"]').value = 'daily';
    container.appendChild(row);
    bindRemove();
});

function bindRemove() {
    document.querySelectorAll('.remove-habit').forEach(function(btn) {
        btn.onclick = function() {
            if (document.querySelectorAll('.template-habit-row').length > 1) {
                btn.closest('.template-habit-row').remove();
            }
        };
    });
}
bindRemove();
</script>
{% endblock %}
