version: "3.8"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - db-data:/app/data
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=change-me-in-production
      - DATABASE_URL=sqlite:///data/habit_tracker.db
    restart: unless-stopped

volumes:
  db-data:
