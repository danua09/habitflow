services:
  - type: web
    name: habitflow
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "flask --app run db upgrade && python seed.py && gunicorn run:app"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.13.4"
